    <path d="M12 56V26C12 14.9543 20.9543 6 32 6C43.0457 6 52 14.9543 52 26V56" stroke="#444F3C" stroke-width="2" stroke-linecap="round"/>
    <path d="M18 56V27C18 19.268 24.268 13 32 13C39.732 13 46 19.268 46 27V56" stroke="#DECFC0" stroke-width="1.2" stroke-linecap="round"/>
    
    <!-- Base Threshold line -->
    <path d="M6 56H58" stroke="#444F3C" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Botanical Olive Branch Intertwined -->
    <!-- Left Leaf Stem -->
    <path d="M22 42C24 36 29 33 32 30" stroke="#82917E" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Left Leaves -->
    <path d="M22 38C19 35 21 31 25 33C27 34 26 37 22 38Z" fill="#82917E"/>
    <path d="M26 31C24 27 27 24 30 26C31 28 29 30 26 31Z" fill="#82917E"/>
    
