    <!-- Right Leaves -->
    <path d="M35 27C38 25 41 27 39 30C37 32 35 30 35 27Z" fill="#82917E"/>
    <path d="M38 21C42 19 44 22 42 24C40 26 38 24 38 21Z" fill="#82917E"/>
    
    <!-- Center Refined Brass Star/Keystone Accent -->
    <circle cx="32" cy="18" r="2.5" fill="#B89358"/>
  </g>

  <!-- Editorial Brand Typography -->
  <g transform="translate(76, 2)">
    <!-- Brand Title -->
    <text x="0" y="32" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="22" font-weight="600" letter-spacing="0.12em" fill="#181C17">THE HOUSE CHAPTER</text>
    <!-- Tagline -->
    <text x="2" y="49" font-family="'Playfair Display', Georgia, serif" font-style="italic" font-size="11.5" letter-spacing="0.04em" fill="#7A6458">Ideas for a home well lived.</text>
  </g>
</svg>
